[pytest]
# The tests live in tests/ but the code they import (main, storage) lives one
# level up in backend/. `pythonpath = .` puts backend/ on the import path so
# the tests can say `import main` exactly as uvicorn does — no sys.path
# fiddling in conftest, and no need to turn the app into an installable
# package just to test it.
pythonpath = .
testpaths = tests
